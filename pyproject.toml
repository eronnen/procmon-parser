[project]
name = "procmon-parser"
dynamic = ["version"]
description = "Parser to Procmon configuration and log files formats"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ely Ronnen", email = "elyronnen@gmail.com" },
]
dependencies = [
    "construct>=2.10.54",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/eronnen/procmon-parser"
Repository = "https://github.com/eronnen/procmon-parser.git"

[dependency-groups]
dev = [
    "pytest",
    "python-dateutil",
    "coverage",
    "ruff",
    "ty",
    "pre-commit>=4.3.0",
    "poethepoet",
    "rich>=15.0.0",
]

# Run with `uv run poe <task> --pml-path <path> --csv-path <path>`
[tool.poe.tasks.manual-test]
help = "Compare a local PML file against its CSV export"
cmd = "python -m tests.manual_test"

[tool.poe.tasks.benchmark]
help = "Time reading a local PML file against reading its CSV export"
cmd = "python -m tests.benchmarks"

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# the parsers spell out every binary case explicitly, even when branches share a body
ignore = ["SIM114"]

[tool.pytest.ini_options]
filterwarnings = ["error"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "procmon_parser/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["procmon_parser"]

[tool.hatch.build.targets.sdist]
# tests/resources holds 13MB of PML captures, so the tests live in git only
include = [
    "procmon_parser",
    "docs",
    "README.md",
    "LICENSE",
]
