[project]
name = "procmon-parser"
version = "0.3.13"
description = "Parser to Procmon configuration and log files formats"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ely Ronnen", email = "elyronnen@gmail.com" },
]
dependencies = [
    "construct>=2.10.54",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/eronnen/procmon-parser"
Repository = "https://github.com/eronnen/procmon-parser.git"

[dependency-groups]
dev = [
    "pytest",
    "python-dateutil",
    "coverage",
    "flake8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["procmon_parser"]

[tool.hatch.build.targets.sdist]
include = [
    "procmon_parser",
    "docs",
    "tests",
    "README.md",
    "LICENSE",
]
