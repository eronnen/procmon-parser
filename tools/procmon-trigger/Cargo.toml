[package]
name = "procmon-trigger"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Triggers Procmon operations so captures can be used as procmon-parser test resources"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Mailslots",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[lints.clippy]
all = "deny"
